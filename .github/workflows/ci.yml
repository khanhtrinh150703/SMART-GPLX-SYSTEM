name: Project CI - Standard Validation

on:
  push:
    branches: [main, develop, back-end, front-end, ai]
  pull_request:
    branches: [main, develop, back-end, front-end, ai]

# Tự động hủy các bản build cũ nếu có push mới (Tiết kiệm tài nguyên)
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  # ==========================================
  # 1. NEXTJS FRONTEND JOB
  # ==========================================
  nextjs-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          # Nếu package-lock.json nằm ở gốc thì để nguyên, 
          # nếu nằm trong thư mục frontend thì trỏ đúng vào đó
          cache-dependency-path: "**/package-lock.json"

      - name: 📥 Install Dependencies
        # Loại bỏ hoàn toàn 'npm cache clean'
        # Thêm --prefer-offline để ưu tiên dùng hàng trong cache thay vì tải mới
        run: npm ci --include=optional --ignore-scripts --prefer-offline

      - name: 🛡️ Security Scan (Dependencies)
        run: npm audit --audit-level=high

      - name: 🔍 Lint Check
        run: npm run lint:fe

      - name: 🏗️ Build App
        # Sử dụng biến môi trường để Next.js không thu thập dữ liệu rác, giúp build nhanh hơn
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build -w nextjs-frontend

  # ==========================================
  # 2. NODE BACKEND JOB
  # ==========================================
  node-backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🐳 Start Database (Docker)
        run: |
          echo "🧹 [CI Infra] Purging faulty mount points and clearing docker runtime..."
          
          docker compose down --volumes --remove-orphans
          
          [ -d "prometheus.yml" ] && rm -rf prometheus.yml
          [ -d "loki-config.yaml" ] && rm -rf loki-config.yaml
          
          docker compose up -d

      - name: 📥 Install Dependencies
        # Cài đặt toàn bộ dự án từ thư mục gốc
        run: npm ci

      - name: 🛡️ Security Scan (Dependencies)
        run: npm audit --audit-level=high

      - name: 🔍 Lint Check
        # Kiểm tra code style của backend
        run: npm run lint:be

      - name: 💎 Setup Database Schema (Prisma)
        # Sử dụng lệnh db:push:cicd bạn đã định nghĩa
        # Lệnh này sẽ chạy Prisma Gen và Push Schema vào Docker DB
        run: npm run db:push:cicd

      - name: 🧪 Run Integration Tests
        # Chạy bộ test Jest tích hợp
        env:
          LOKI_HOST: "http://127.0.0.1:3100"
          
        run: npm run test:be:cicd

      - name: 🧹 Stop Services
        if: always() # Luôn chạy bước này kể cả khi test fail để dọn dẹp
        run: docker compose down