name: Project CI - Standard Validation

on:
  push:
    branches: [main, develop, feat/auth-core]
  pull_request:
    branches: [main, develop, feat/auth-core]

jobs:
  nextjs-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nextjs-frontend # Tự động cd vào đây cho mọi lệnh run
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/nextjs-frontend/package-lock.json

      - name: Install & Build
        run: |
          npm install
          npm run build

  node-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/node-backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: smart_gplx_test
        ports:
          - 3306:3306
        # Đảm bảo Postgres đã sẵn sàng trước khi chạy các bước tiếp theo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Nên đồng bộ với frontend
          cache: "npm"
          cache-dependency-path: apps/node-backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Sync Database Schema
        run: npx prisma db push # Tạo bảng vào Postgres service
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/smart_gplx_test"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/smart_gplx_test"