name: Project CI - Simple Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    nextjs-frontend:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Install & Build Web
          run: |
            cd apps/nextjs-frontend
            npm install
            npm run build