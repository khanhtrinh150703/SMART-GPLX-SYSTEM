name: Project CI - Standard Validation

on:
  push:
    branches: [main, develop, back-end, front-end, ai]
  pull_request:
    branches: [main, develop, back-end, front-end, ai]

# Tự động hủy các bản build cũ nếu có push mới (Tiết kiệm tài nguyên)
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  # ==========================================
  # 1. NEXTJS FRONTEND JOB
  # ==========================================
  nextjs-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          # Trỏ về file lock ở gốc dự án
          cache-dependency-path: package-lock.json

      - name: 📥 Install Dependencies (Cài đặt từ Gốc)
        run: |
            npm cache clean --force 
            npm ci --include=optional --ignore-scripts

      - name: 🔍 Lint Check
        # Chạy lint riêng cho frontend từ thư mục gốc
        run: npm run lint:fe

      - name: 🏗️ Build App (Xây dựng ứng dụng)
        run: npm run build -w nextjs-frontend

  # ==========================================
  # 2. NODE BACKEND JOB
  # ==========================================
  node-backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🐳 Start Database (Docker)
        # Chạy Docker Compose từ gốc để khởi động Postgres/MySQL
        run: docker compose up -d

      - name: 📥 Install Dependencies
        # Cài đặt toàn bộ dự án từ thư mục gốc
        run: npm ci

      - name: 🔍 Lint Check
        # Kiểm tra code style của backend
        run: npm run lint:be

      - name: 💎 Setup Database Schema (Prisma)
        # Sử dụng lệnh db:push:cicd bạn đã định nghĩa
        # Lệnh này sẽ chạy Prisma Gen và Push Schema vào Docker DB
        run: npm run db:push:cicd

      - name: 🧪 Run Integration Tests
        # Chạy bộ test Jest tích hợp
        run: npm run test:be:cicd

      - name: 🧹 Stop Services
        if: always() # Luôn chạy bước này kể cả khi test fail để dọn dẹp
        run: docker compose down