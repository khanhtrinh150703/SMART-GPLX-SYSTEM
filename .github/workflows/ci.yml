name: Project CI - Standard Validation

on:
  push:
    branches: [main, develop, back-end, front-end, ai]
  pull_request:
    branches: [main, develop, back-end, front-end, ai]

jobs:
  nextjs-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nextjs-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/nextjs-frontend/package-lock.json

      - name: Install & Build
        run: |
          npm install
          npm run build

  node-backend:
    runs-on: ubuntu-latest
    # KHÔNG DÙNG services CỦA GITHUB NỮA, CHÚNG TA SẼ DÙNG DOCKER COMPOSE
    
    steps:
      - uses: actions/checkout@v4

      # 1. KHỞI ĐỘNG DỊCH VỤ BẰNG DOCKER COMPOSE
      - name: Start Database & Redis with Docker Compose
        # Giả sử file docker-compose.yml của bạn nằm ở thư mục gốc (root)
        run: docker-compose up -d
        
      # 2. CHỜ DATABASE KHỞI ĐỘNG XONG (Rất quan trọng)
      # MySQL thường mất khoảng 10-15 giây để sẵn sàng nhận kết nối
      - name: Wait for MySQL to be ready
        run: |
          echo "Đang chờ MySQL khởi động..."
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            sleep 2
          done
          echo "MySQL đã sẵn sàng!"

      # 3. TIẾP TỤC SETUP NODE VÀ CHẠY TEST NHƯ BÌNH THƯỜNG
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/node-backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/node-backend
        run: npm install --ignore-scripts

      - name: Sync Database Schema
        working-directory: apps/node-backend
        run: npx prisma db push 
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/smart_gplx_test"

      - name: Generate Prisma Client
        working-directory: apps/node-backend
        run: npx prisma generate

      - name: Run Lint
        working-directory: apps/node-backend
        run: npm run lint

      - name: Run Tests
        working-directory: apps/node-backend
        run: npm test
        env:
          DATABASE_URL: "mysql://root:password@127.0.0.1:3306/smart_gplx_test"
          REDIS_URL: "redis://localhost:6379"
          EMAIL_USER: gplx@dividesk.com
          EMAIL_PASS: rhrkeoshkiuehtej

      # 4. DỌN DẸP SAU KHI TEST XONG (Tùy chọn)
      - name: Stop Docker Compose
        if: always() # Luôn chạy dù test pass hay fail
        run: docker-compose down