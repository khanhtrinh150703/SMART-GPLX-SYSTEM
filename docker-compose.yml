services:
  web:
    build: ./apps/web
    ports: ["3000:3000"]
  services:
    mysql:
      image: mysql:8.0
      ports:
        - "3306:3306"
      environment:
        MYSQL_DATABASE: smart_gplx_db
    redis:
      image: redis:alpine
      ports:
        - "6379:6379"
  ai-engine:
    build: ./apps/ai-engine
    ports: ["8000:8000"]