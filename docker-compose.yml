version: '3.8'

services:
  # --- NHÓM MONITORING (GIÁM SÁT) ---
  loki:
    image: grafana/loki:latest
    container_name: smart_gplx_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - smart-gplx-network

  prometheus:
    image: prom/prometheus:latest
    container_name: smart_gplx_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=730d'
    networks:
      - smart-gplx-network

  grafana:
    image: grafana/grafana:latest
    container_name: smart_gplx_grafana
    ports:
      - "3200:3000" 
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - smart-gplx-network
    depends_on:
      - loki
      - prometheus

  # --- NHÓM CACHE & DATABASE (CƠ SỞ DỮ LIỆU) ---
  redis-cache:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass "root"
    networks:
      - smart-gplx-network

  mysql-db:
    image: mysql:8
    container_name: smart_gplx_mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=smart_gplx_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smart-gplx-network

    # --- NHÓM NOSQL ---
  mongodb:
    image: mongo:latest
    container_name: smart_gplx_mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db 
    networks:
      - smart-gplx-network

# --- KHAI BÁO MẠNG ---
networks:
  smart-gplx-network:
    driver: bridge

# --- KHAI BÁO KHỐI DỮ LIỆU (CHỖ BẠN BỊ THIẾU GÂY RA LỖI) ---
volumes:
  redis_data:
  mysql_data:
  loki_data:
  mongo_data:
  prometheus_data: