  #   build: ./apps/web
  #   ports:
  #     - "3000:3000" # Frontend chạy cổng 3000
  #   networks:
  #     - smart-gplx-network

  # backend:
  #   build: ./apps/node-backend
  #   ports:
  #     - "3001:3000" # Backend chạy cổng 3001 (tránh trùng với Web)
  #   environment:
  #     - LOKI_HOST=http://loki:3100 # Gọi trực tiếp bằng tên dịch vụ "loki"
  #     - DATABASE_URL=mysql://user:pass@mysql:3306/smart_gplx_db # (Nếu có DB)
  #   networks:
  #     - smart-gplx-network
  #   depends_on:
  #     - loki

networks:
  smart-gplx-network:
    driver: bridge

volumes:
  redis_data: